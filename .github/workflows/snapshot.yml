name: Обновление Bitcoin-снимка

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snapshot.yml"
      - "scripts/**"
      - "!scripts/notify*.mjs"   # уведомления живут снаружи решающего контура: их правка не должна
                                 # запускать пересборку снимка и деплой страницы
      - "docs/**"
      - "package.json"

permissions:
  contents: write   # коммит публичного снимка в репозиторий; raw datasets живут только в Actions Cache
  issues: write     # встроенный сторож синхронизирует инцидент-issue каждым прогоном
  # `pages: write` и `id-token: write` убраны вместе с развёртыванием GitHub Pages:
  # данные теперь уезжают в R2, сайт публикуется отдельным site.yml в Cloudflare, и
  # права на публикацию страницы этому прогону больше не нужны ни на секунду.

# Публикация не отменяется на полпути: снимок, доехавший в бакет наполовину, — это
# страница, показывающая обрезанный JSON.
concurrency:
  group: btc-21m-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    # СБОРЩИК ЖИВЁТ НА VPS. Здесь он остаётся целиком, но выключенным: 6 августа
    # авария GitHub Actions остановила сбор на семь часов при полностью исправных
    # источниках, а снимок этой панели читают двадцать девять чужих API — зависеть
    # сверх того от очереди раннеров незачем. Такт даёт systemd-таймер
    # `dash-838.timer`, обвязка — `/usr/local/sbin/dash-snapshot`, и она выполняет
    # ровно те же шаги в том же порядке, включая `npm run check` перед сбором.
    #
    # Условие, а не удаление файла: два писателя в один репозиторий — это гонка за
    # docs/snapshot.json и два ответа на вопрос «какие сейчас данные». Чтобы вернуть
    # сбор сюда, достаточно завести переменную репозитория COLLECTOR=github и
    # остановить таймер на сервере — именно в этом порядке.
    if: vars.COLLECTOR == 'github'
    runs-on: ubuntu-latest
    # Сборщику своих 8 минут хватает с запасом; 20 — это страховка узла, а не бюджет.
    # Тридцать минут ожидания очереди GitHub Pages отсюда ушли вместе с самой очередью.
    timeout-minutes: 20
    steps:
      # fetch-depth: 1. Публикация делает rebase на свежий tip ветки — полная история не нужна,
      # а полный клон дорожает каждый день: snapshot.json переписывается десятки раз в сутки.
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Восстановить внутреннее состояние
        uses: actions/cache@v5
        with:
          path: .state/cache.json
          key: btc21m-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            btc21m-state-${{ github.ref_name }}-
            btc21m-state-

      # 1. Структурные тесты работают на изолированном mock и не трогают опубликованный снимок,
      #    поэтому ведут себя одинаково на ноутбуке и в CI. Сюда входит live-regression: он доказывает,
      #    что живой кандидат прошёл бы гейт публикации.
      - name: Изолированные тесты
        run: npm run check

      # 2. Проверка FRED-ключа — НЕОБЯЗАТЕЛЬНАЯ диагностика. FRED_KEY не требуется: без него сборщик
      #    читает FRED через keyless CSV-эндпоинт (fredgraph.csv). Шаг никогда не блокирует публикацию —
      #    если ключ задан, он валидирует его; если нет, подтверждает, что keyless-путь жив.
      - name: Проверить доступ к FRED (необязательно)
        continue-on-error: true
        env:
          FRED_KEY: ${{ secrets.FRED_KEY }}
        run: npm run fred-smoke

      # 3. Диагностика. Никогда не блокирует публикацию: она нужна, чтобы в логе было видно, что
      #    каждый источник — первичный И резервный — реально ответил ИМЕННО С ЭТОГО РАННЕРА.
      - name: Диагностика эндпоинтов
        continue-on-error: true
        env:
          FRED_KEY: ${{ secrets.FRED_KEY }}
          CM_API_KEY: ${{ secrets.CM_API_KEY }}
          # Разведка SosoValue (шаг 1): ключ нужен ТОЛЬКО диагностике. Сборщик снимка его не
          # получает и от него не зависит — обещание «панель работает без ключей» в силе.
          SOSO_API_KEY: ${{ secrets.SOSO_API_KEY }}
        run: npm run probe

      # 4. Live-кандидат пишется во ВРЕМЕННЫЕ пути. docs/snapshot.json хранит последний
      #    подтверждённый снимок, пока кандидат не докажет свою пригодность.
      #    FRED_KEY необязателен: без него сборщик читает FRED через keyless CSV-эндпоинт.
      - name: Собрать live-кандидата
        env:
          FRED_KEY: ${{ secrets.FRED_KEY }}
          CM_API_KEY: ${{ secrets.CM_API_KEY }}
          # Необязателен: маршрут SosoValue отвечает и без ключа. Проброшен, чтобы слой пережил
          # включение авторизации провайдером; его отсутствие лишь отключает дополнение свежих дней.
          SOSO_API_KEY: ${{ secrets.SOSO_API_KEY }}
          OUT: .candidate/snapshot.json
          STATE: .candidate/cache.json
          PREVIOUS_STATE: .state/cache.json
          PREVIOUS_PUBLIC: docs/snapshot.json
        run: npm run snapshot

      # 5. Строгая проверка самого кандидата. REQUIRE_LIVE отвергает mock и устаревшие данные; при этом
      #    честно неполный вердикт («переходный» / «недостаточно данных») ПУБЛИКУЕТСЯ, а не замораживается —
      #    прозрачность деградации важнее иллюзии полноты. Последний подтверждённый снимок остаётся
      #    только если кандидат вовсе не проходит REQUIRE_LIVE.
      - name: Проверить live-кандидата
        env:
          REQUIRE_LIVE: "1"
          OUT: .candidate/snapshot.json
          STATE: .candidate/cache.json
        run: npm run verify

      # 6. Публикуется только проверенный кандидат.
      - name: Принять кандидата
        run: |
          set -euo pipefail
          mkdir -p .state
          cp .candidate/snapshot.json docs/snapshot.json
          cp .candidate/cache.json .state/cache.json

      # 7. КОММИТ ИДЁТ ПЕРВЫМ, и это не вкусовщина. Пока он стоял после публикации, любой сбой
      #    Pages уносил вместе с собой и данные: 6 августа развёртывание десять минут висело в
      #    очереди GitHub и падало по таймауту, шаг коммита не выполнялся ни разу, и снимок
      #    замер на 11:56 UTC — на шесть часов, при живом сборщике и полностью исправных
      #    источниках. Две публикации независимы, и порядок между ними обязан быть таким,
      #    чтобы отказ внешней не отменял внутреннюю: история снимков в репозитории — это то,
      #    из чего страница восстанавливается, а не наоборот.
      #
      #    Коммит НЕ заменяет Actions Cache: public JSON не содержит raw datasets, поэтому при
      #    вытеснении кэша stale-fallback на один цикл исчезает.
      - name: Сохранить снимок в репозиторий
        run: |
          set -euo pipefail
          branch="${GITHUB_REF_NAME:-main}"
          git config user.name "21m-dashboard-bot"
          git config user.email "bot@users.noreply.github.com"
          # Гонка с параллельным пушем разрешается ДЕТЕРМИНИРОВАННО, а не ретраями: если origin
          # ушёл вперёд и там другой docs/snapshot.json, ребейз конфликтует на каждой попытке
          # одинаково (файл целиком переписывается), и три ретрая просто трижды падают. При этом
          # правильный исход очевиден: побеждает снимок ЭТОГО прогона — он собран позже.
          # Поэтому вместо ребейза мы каждый раз переносим свой файл поверх свежего origin
          # (reset + повторный add), что конфликтов не создаёт.
          pushed=0
          for attempt in 1 2 3; do
            git fetch origin "$branch" || { sleep $((attempt*5)); continue; }
            # ВАЖНО: смешанный reset, а НЕ --soft. `--soft` двигает только HEAD и оставляет
            # ИНДЕКС с деревом старого коммита — тогда `git commit` фиксирует это старое дерево
            # целиком и молча ОТКАТЫВАЕТ всё, что кто-либо запушил, пока шёл прогон (проверено
            # воспроизведением на тестовом репозитории: правка в scripts/ исчезала бесследно).
            # Смешанный reset приводит индекс к свежему origin, и в коммит попадает ровно снимок.
            git reset -q "origin/$branch" || { sleep $((attempt*5)); continue; }
            cp .candidate/snapshot.json docs/snapshot.json
            git add docs/snapshot.json
            if git diff --cached --quiet; then
              echo "Снимок не изменился"
              pushed=1
              break
            fi
            git commit -q -m "BTC snapshot $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]" || { sleep $((attempt*5)); continue; }
            if git push origin "HEAD:$branch"; then pushed=1; break; fi
            sleep $((attempt*5))
          done
          if [ "$pushed" != "1" ]; then
            echo "::error::snapshot commit was not pushed after 3 attempts"
            exit 1
          fi

      # 8. ДАННЫЕ ПУБЛИКУЮТСЯ ОТСЮДА — одним объектом в R2, а не публикацией сайта.
      #    Раньше здесь стояло развёртывание GitHub Pages, и это связывало две частоты,
      #    которым связываться незачем: снимок обновляется каждый час, код страницы —
      #    раз в несколько дней. 6 августа очередь Pages встала, и вместе с публикацией
      #    встали данные. Теперь страница живёт в Cloudflare Pages (проект tzi-838,
      #    публикуется отдельным site.yml при изменении кода), а functions/snapshot.json.js
      #    отдаёт этот объект с того же адреса, с которого страница его и просила.
      #
      #    curl --aws-sigv4, а не AWS CLI: R2 говорит по протоколу S3, подпись у curl
      #    встроенная, и это на одну предустановленную зависимость меньше.
      - name: Опубликовать снимок в R2
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          code=$(curl -sS -X PUT -o /tmp/r2-put.log -w '%{http_code}' \
            --user "${R2_ACCESS_KEY_ID}:${R2_SECRET_ACCESS_KEY}" \
            --aws-sigv4 "aws:amz:auto:s3" \
            -H "Content-Type: application/json" \
            --data-binary @docs/snapshot.json \
            "${endpoint}/dash-838/snapshot.json")
          if [ "$code" != "200" ]; then
            echo "::error::R2 PUT вернул $code"; cat /tmp/r2-put.log; exit 1
          fi
          # Читаем обратно и сверяем побайтово. Успешный PUT говорит, что запрос принят,
          # а вопрос, на который надо ответить, другой: лежит ли теперь в бакете именно
          # тот снимок, который собрал этот прогон.
          curl -sS --fail \
            --user "${R2_ACCESS_KEY_ID}:${R2_SECRET_ACCESS_KEY}" \
            --aws-sigv4 "aws:amz:auto:s3" \
            -o /tmp/r2-readback.json \
            "${endpoint}/dash-838/snapshot.json"
          if ! cmp -s docs/snapshot.json /tmp/r2-readback.json; then
            echo "::error::в R2 лежит не то, что опубликовали"; exit 1
          fi
          echo "опубликовано $(wc -c < docs/snapshot.json) байт, сверено побайтово"

      # 9. Встроенный сторож. Отдельный monitor.yml получает от GitHub-планировщика 2–6 тиков из
      #    ожидаемых 12/сутки и проспал единственный реальный инцидент (протухание >3ч ночью 21.07).
      #    Этот шаг синхронизирует инцидент-issue КАЖДЫМ ежечасным прогоном и никогда не блокирует
      #    публикацию; monitor.yml остаётся независимым резервом (и принимает внешний dispatch).
      - name: Проверить живой контур (не блокирует)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MONITOR_ALERT: "1"
          SNAPSHOT_URL: https://tzi-838.pages.dev/snapshot.json
        run: node scripts/monitor-live.mjs
