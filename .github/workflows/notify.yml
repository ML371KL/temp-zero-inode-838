name: Уведомления в Telegram

# Запускается ПОСЛЕ штатного прогона снимка: сам GitHub-cron в этом репозитории ненадёжен,
# а снимок дёргается внешним будильником — так уведомления наследуют его такт.
# СОЗНАТЕЛЬНО не входит в npm run check и не трогает решающий контур: уведомления читают уже
# опубликованное состояние и не имеют права ни изменить решение, ни заморозить публикацию.
on:
  # Будит НЕ прогон сборки, а сам коммит снимка. Сборка уехала на VPS, и
  # `workflow_run` теперь не наступает никогда — уведомления замолчали бы, не сказав
  # об этом ни слова. Коммит приходит с той же машины и в тот же момент, что и данные,
  # поэтому такт наследуется ровно как раньше.
  #
  # Отсюда же требование к обвязке на сервере: её коммит не несёт [skip ci]. Прогон
  # сборки, который это заменяет, ставил его — и, если сбор когда-нибудь вернут в
  # Actions переменной COLLECTOR, метку из его сообщения придётся убрать, иначе
  # уведомления снова замолчат молча.
  push:
    branches: [main]
    paths:
      - "docs/snapshot.json"
  workflow_dispatch:
    inputs:
      ping:
        description: "Проверка связи: отправить одно тестовое сообщение и выйти"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ref: main — чтобы читать снимок, ТОЛЬКО ЧТО закоммиченный прогоном сборки, а не состояние
      # на момент его старта.
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # Состояние «что уже отправлено» живёт в Actions Cache тем же приёмом, что и .state/cache.json
      # сборщика. Потеря кэша безопасна: скрипт увидит пустое состояние, зафиксирует базу заново
      # и промолчит — худший исход это пропуск уведомления, а не лавина сообщений.
      #
      # Восстановление и сохранение РАЗНЕСЕНЫ на два шага. Единый actions/cache сохраняет файл
      # только при успешном прогоне, а скрипт пишет индекс доставленного после каждой отправки
      # именно затем, чтобы упавший прогон не повторил уже ушедшее. С единым шагом это не работало:
      # падение посреди рассылки (ошибка Telegram, тайм-аут) теряло и базу, и индекс, и следующий
      # прогон слал те же сообщения заново.
      - name: Восстановить состояние уведомлений
        uses: actions/cache/restore@v5
        with:
          path: .notify/state.json
          key: btc21m-notify-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            btc21m-notify-${{ github.ref_name }}-

      # Тесты стоят перед рассылкой, но её НЕ блокируют. Раньше красный тест молча выключал
      # уведомления целиком — включая сообщения о доле, ради которых бот существует. Теперь упавший
      # тест делает три вещи: красит прогон (последний шаг), переводит рассылку в осторожный режим
      # (NOTIFY_SELFTEST=failure: идут сообщения о решении, сигналы риска и предупреждения о данных;
      # публикации и пересмотры, в которых ошибка кода могла бы дать лавину, не рассылаются) и один
      # раз в сутки сообщает об этом в Telegram.
      - name: Тесты уведомлений
        id: selftest
        continue-on-error: true
        run: node scripts/notify-test.mjs

      - name: Разослать изменения
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          NOTIFY_MODEL: ${{ vars.NOTIFY_MODEL }}
          NOTIFY_SOURCE: json
          NOTIFY_SNAPSHOT: docs/snapshot.json
          NOTIFY_STATE: .notify/state.json
          NOTIFY_PING: ${{ inputs.ping && '1' || '0' }}
          NOTIFY_SELFTEST: ${{ steps.selftest.outcome }}
          NEXUS_EVENTS_URL: ${{ vars.NEXUS_EVENTS_URL }}
          NEXUS_SOURCE_ID: "838"
          NEXUS_INGEST_TOKEN: ${{ secrets.NEXUS_INGEST_TOKEN }}
        run: node scripts/notify.mjs

      # Сохраняется при ЛЮБОМ исходе рассылки, включая отмену по тайм-ауту: на диске лежит либо
      # новая база, либо прежняя база с пополненным индексом доставленного — оба состояния верны.
      # Номер попытки в ключе нужен, чтобы «Re-run jobs» не упёрся в уже занятый ключ и не остался
      # без сохранения. Файла нет (кэш пуст, а скрипт упал до первой записи) — сохранять нечего.
      - name: Сохранить состояние уведомлений
        if: always() && hashFiles('.notify/state.json') != ''
        uses: actions/cache/save@v5
        with:
          path: .notify/state.json
          key: btc21m-notify-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Красный прогон при упавших тестах
        if: always() && steps.selftest.outcome == 'failure'
        run: |
          echo "::error::Тесты уведомлений не прошли: рассылка шла в осторожном режиме (без публикаций и пересмотров данных)."
          exit 1
